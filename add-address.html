<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Address - BazarBasket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="BazarBasket-Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="BazarBasket-Logo.png" alt="BazarBasket Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Bazar<span class="logo-title-green">Basket</span></span>
                    <span class="logo-tagline">--Fresh Grocery , Everyday --</span>
                </div>
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Search for fresh groceries...">
                <i class="fas fa-search"></i>
            </div>
            <!-- Location Selector -->
            <div class="location-selector" id="header-location-selector">
                <i class="fas fa-map-marker-alt"></i>
                <span id="selected-location-text">Mumbai, 400001</span>
            </div>
            <div class="header-actions">
                <a href="shopping-cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">3</span>
                </a>
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>
        </div>
    </header>

    <!-- Secondary Navigation -->
    <nav class="secondary-nav">
        <div class="container">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="#">Deals</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <section class="page-header">
            <div class="container">
                <h1>My Account</h1>
                <p>Manage your profile, orders, and addresses.</p>
            </div>
        </section>

        <section class="profile-section">
            <div class="container profile-container">
                <!-- Profile Sidebar -->
                <aside class="profile-sidebar">
                    <div class="profile-user">
                        <img src="https://placehold.co/80x80/E2E8F0/475569?text=R" alt="User Avatar">
                        <h4>Raushan Kumar</h4>
                        <p>raushan@example.com</p>
                    </div>
                    <nav class="profile-nav">
                        <ul>
                            <li><a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a></li>
                            <li><a href="my-orders.html"><i class="fas fa-box"></i> My Orders</a></li>
                            <li><a href="my-addresses.html" class="active"><i class="fas fa-map-marker-alt"></i> My Addresses</a></li>
                            <li><a href="wishlist.html"><i class="fas fa-heart"></i> Wishlist</a></li>
                            <li><a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                        </ul>
                    </nav>
                </aside>

                <!-- Add Address Form -->
                <div class="profile-content">
                    <div class="form-step">
                        <h3>Add a New Address</h3>
                        <form action="my-addresses.html">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="fullname">Full Name</label>
                                    <input type="text" id="fullname" placeholder="John Doe" required>
                                </div>
                                <div class="form-group">
                                    <label for="phone">Phone Number</label>
                                    <input type="tel" id="phone" placeholder="+91 98765 43210" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="address">Street Address</label>
                                <input type="text" id="address" placeholder="House No, Street Name" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="city">City</label>
                                    <input type="text" id="city" placeholder="e.g. Mumbai" required>
                                </div>
                                <div class="form-group">
                                    <label for="pincode">Pincode</label>
                                    <input type="text" id="pincode" placeholder="e.g. 400001" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Address</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
