<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - BazarBasket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="BazarBasket-Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="BazarBasket-Logo.png" alt="BazarBasket Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Bazar<span class="logo-title-green">Basket</span></span>
                    <span class="logo-tagline">--Fresh Grocery , Everyday --</span>
                </div>
            </a>
    </header>

    <!-- Main Content -->
    <main>
        <section class="error-section">
            <div class="container">
                <div class="error-content">
                    <img src="https://placehold.co/300x300/FEE2E2/EF4444?text=Oops!" alt="Error illustration" class="error-image">
                    <h1>404</h1>
                    <h2>Page Not Found</h2>
                    <p>Sorry, the page you are looking for does not exist. It might have been moved or deleted.</p>
                    <a href="index.html" class="btn btn-primary">Go to Homepage</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
