<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - BazarBasket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="BazarBasket-Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="BazarBasket-Logo.png" alt="BazarBasket Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Bazar<span class="logo-title-green">Basket</span></span>
                    <span class="logo-tagline">--Fresh Grocery , Everyday --</span>
                </div>
            </a>
            <nav class="main-nav">
                <button class="nav-close-btn" aria-label="Close navigation"><i class="fas fa-times"></i></button>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="categories.html">Categories</a></li>
                    <li><a href="#">Deals</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="shopping-cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">3</span>
                </a>
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>
            <button class="mobile-nav-toggle" aria-label="Open navigation"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="form-section">
            <div class="container">
                <div class="form-container">
                    <h2>Enter Verification Code</h2>
                    <p>A 6-digit code has been sent to your email address.</p>
                    <form action="reset-password.html">
                        <div class="form-group otp-group">
                            <input type="text" maxlength="1" required>
                            <input type="text" maxlength="1" required>
                            <input type="text" maxlength="1" required>
                            <input type="text" maxlength="1" required>
                            <input type="text" maxlength="1" required>
                            <input type="text" maxlength="1" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Verify Code</button>
                    </form>
                    <p class="form-switch">Didn't receive the code? <a href="#">Resend</a></p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
