<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BazarBasket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="BazarBasket-Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section (reused from index.html) -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="BazarBasket-Logo.png" alt="BazarBasket Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Bazar<span class="logo-title-green">Basket</span></span>
                    <span class="logo-tagline">--Fresh Grocery , Everyday --</span>
                </div>
            </a>
            <div class="header-actions">
                <a href="shopping-cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">3</span>
                </a>
                <div class="profile-dropdown">
                    <button class="profile-btn" aria-label="User account">
                        <i class="fas fa-user-circle"></i>
                    </button>
                    <div class="profile-dropdown-content">
                        <a href="login.html" class="btn btn-primary">Login</a>
                        <a href="register.html" class="btn btn-secondary">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="form-section">
            <div class="container">
                <div class="form-container">
                    <h2>Welcome Back!</h2>
                    <p>Login to continue to BazarBasket.</p>
                    <form>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                        <a href="forgot-password.html" class="form-link">Forgot Password?</a>
                        <button type="submit" class="btn btn-primary btn-full">Login</button>
                    </form>
                    <p class="form-switch">Don't have an account? <a href="register.html">Register Now</a></p>
                </div>
            </div>
        </section>
    </main>

    <button id="back-to-top-btn" class="back-to-top-btn" title="Go to top"><i class="fas fa-arrow-up"></i></button>

    <!-- Floating Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- 1. Home -->
        <a href="index.html" class="nav-item" data-page="index.html">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>

        <!-- 2. Categories -->
        <a href="categories.html" class="nav-item" data-page="categories.html">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                <rect x="3" y="14" width="7" height="7" rx="2"></rect>
            </svg>
            <span>Categories</span>
        </a>

        <!-- 3. Offer -->
        <a href="offers.html" class="nav-item" data-page="offers.html">
            <svg viewBox="0 0 24 24">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            <span>Offer</span>
        </a>

        <!-- 4. Cart -->
        <a href="shopping-cart.html" class="nav-item" data-page="shopping-cart.html">
            <svg viewBox="0 0 24 24">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Cart</span>
        </a>
    </nav>

    <script src="script.js"></script>

</body>
</html>
