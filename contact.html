<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BazarBasket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="BazarBasket-Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="BazarBasket-Logo.png" alt="BazarBasket Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Bazar<span class="logo-title-green">Basket</span></span>
                    <span class="logo-tagline">--Fresh Grocery , Everyday --</span>
                </div>
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Search for fresh groceries...">
                <i class="fas fa-search"></i>
            </div>
            <!-- Location Selector -->
            <div class="location-selector" id="header-location-selector">
                <i class="fas fa-map-marker-alt"></i>
                <span id="selected-location-text">Mumbai, 400001</span>
            </div>
            <div class="header-actions">
                <a href="shopping-cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">3</span>
                </a>
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="page-header">
            <div class="container">
                <h1>Contact Us</h1>
                <p>We'd love to hear from you! Get in touch with us.</p>
            </div>
        </section>

        <section class="contact-section">
            <div class="container contact-container">
                <!-- Contact Form -->
                <div class="contact-form-wrapper">
                    <h3>Send us a Message</h3>
                    <form>
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <label for="contact-email">Email Address</label>
                            <input type="email" id="contact-email" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="e.g. Order Inquiry" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Send Message</button>
                    </form>
                </div>

                <!-- Contact Info & Map -->
                <div class="contact-info-wrapper">
                    <h3>Contact Information</h3>
                    <div class="contact-info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <p>123 Bazar Street, Market Area,<br>Mumbai, Maharashtra - 400001</p>
                    </div>
                    <div class="contact-info-item">
                        <i class="fas fa-phone-alt"></i>
                        <p>+91 98765 43210</p>
                    </div>
                    <div class="contact-info-item">
                        <i class="fas fa-envelope"></i>
                        <p>support@bazarbasket.app</p>
                    </div>
                    <div class="contact-map">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.717599593579!2d72.83105981485619!3d19.07598378708759!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c6306644edc1%3A0x5da4ed8f8d648c67!2sMumbai%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" 
                            width="100%" 
                            height="250" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <button id="back-to-top-btn" class="back-to-top-btn" title="Go to top"><i class="fas fa-arrow-up"></i></button>

    <!-- Floating Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- 1. Home -->
        <a href="index.html" class="nav-item" data-page="index.html">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>

        <!-- 2. Categories -->
        <a href="categories.html" class="nav-item" data-page="categories.html">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                <rect x="3" y="14" width="7" height="7" rx="2"></rect>
            </svg>
            <span>Categories</span>
        </a>

        <!-- 3. Offer -->
        <a href="#" class="nav-item" data-page="deals">
            <svg viewBox="0 0 24 24">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            <span>Offer</span>
        </a>

        <!-- 4. Cart -->
        <a href="shopping-cart.html" class="nav-item" data-page="shopping-cart.html">
            <svg viewBox="0 0 24 24">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Cart</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
