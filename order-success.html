<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - BazarBasket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="BazarBasket-Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="BazarBasket-Logo.png" alt="BazarBasket Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Bazar<span class="logo-title-green">Basket</span></span>
                    <span class="logo-tagline">--Fresh Grocery , Everyday --</span>
                </div>
            </a>
            <div class="search-bar">
                <input type="text" placeholder="Search for fresh groceries...">
                <i class="fas fa-search"></i>
            </div>
            <div class="location-selector" id="header-location-selector">
                <i class="fas fa-map-marker-alt"></i>
                <span id="selected-location-text">Mumbai, 400001</span>
            </div>
            <div class="header-actions">
                <a href="shopping-cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
                <div class="profile-dropdown">
                    <button class="profile-btn" aria-label="User account">
                        <i class="fas fa-user-circle"></i>
                    </button>
                    <div class="profile-dropdown-content">
                        <a href="login.html" class="btn btn-primary">Login</a>
                        <a href="register.html" class="btn btn-secondary">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="order-success-section">
            <div class="container">
                <div class="success-card">
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2>Thank You For Your Order!</h2>
                    <p>Your order has been placed successfully. You will receive an email confirmation shortly.</p>
                    <p>Your Order ID is: <strong>#BZB123456789</strong></p>
                    <div class="success-actions">
                        <a href="index.html" class="btn btn-secondary">Continue Shopping</a>
                        <a href="#" class="btn btn-primary">Track Your Order</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
