<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BazarBasket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="BazarBasket-Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="BazarBasket-Logo.png" alt="BazarBasket Logo" class="logo-img">
                <div class="logo-text">
                    <span class="logo-title">Bazar<span class="logo-title-green">Basket</span></span>
                    <span class="logo-tagline">--Fresh Grocery , Everyday --</span>
                </div>
            </a>
            <div class="header-actions">
                <a href="shopping-cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">3</span>
                </a>
                <div class="profile-dropdown">
                    <button class="profile-btn" aria-label="User account">
                        <i class="fas fa-user-circle"></i>
                    </button>
                    <div class="profile-dropdown-content">
                        <a href="login.html" class="btn btn-primary">Login</a>
                        <a href="register.html" class="btn btn-secondary">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="page-header">
            <div class="container">
                <h1>Shopping Cart</h1>
                <p>Review your items and proceed to checkout.</p>
            </div>
        </section>

        <section class="shopping-cart-section">
            <div class="container cart-container">
                <div class="cart-items">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Cart Item 1 -->
                            <tr>
                                <td class="cart-product-info">
                                    <img src="https://placehold.co/80x80/A3E635/FFFFFF?text=Broccoli" alt="Broccoli">
                                    <span>Fresh Broccoli</span>
                                </td>
                                <td>₹120</td>
                                <td><input type="number" value="1" min="1"></td>
                                <td>₹120</td>
                                <td><button class="remove-item-btn"><i class="fas fa-trash"></i></button></td>
                            </tr>
                            <!-- Cart Item 2 -->
                            <tr>
                                <td class="cart-product-info">
                                    <img src="https://placehold.co/80x80/FBBF24/FFFFFF?text=Apples" alt="Apples">
                                    <span>Shimla Apples</span>
                                </td>
                                <td>₹180</td>
                                <td><input type="number" value="2" min="1"></td>
                                <td>₹360</td>
                                <td><button class="remove-item-btn"><i class="fas fa-trash"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>₹480</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee</span>
                        <span>₹50</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>Grand Total</span>
                        <span>₹530</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary btn-full">Proceed to Checkout</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
